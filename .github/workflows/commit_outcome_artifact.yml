name: Commit outcome evaluation artifact

on:
  push:
    branches: [agent/outcome-evaluation]

permissions:
  contents: write

jobs:
  commit-artifact:
    if: github.event.head_commit.message != 'Commit outcome evaluation artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/outcome-evaluation
          fetch-depth: 1
          persist-credentials: true
      - name: Install analysis dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-analysis.txt
      - name: Reproduce outcome artifact
        run: |
          python3 analyze_outcome_evaluation.py
          actual="$(gzip -cd 데이터/outcome_evaluation.csv.gz | sha256sum | awk '{print $1}')"
          expected="$(tr -d '[:space:]' < 데이터/outcome_evaluation.sha256)"
          test "$actual" = "$expected"
      - name: Commit artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f 데이터/outcome_evaluation.csv.gz
          if git diff --cached --quiet; then
            echo 'Artifact already committed.'
            exit 0
          fi
          git commit -m 'Commit outcome evaluation artifact'
          git push origin HEAD:agent/outcome-evaluation
