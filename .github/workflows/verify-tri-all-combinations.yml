name: Verify TRI full combination grids

on:
  pull_request:
    paths:
      - '.github/workflows/verify-tri-all-combinations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tri-grids:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
    steps:
      - name: Download and validate complete TRI grids
        shell: bash
        run: |
          python3 - <<'PY'
          import itertools
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          API = "http://apis.data.go.kr/B551015/API160_1/integratedInfo_1"
          KEY = os.environ.get("DATA_GO_KR_SERVICE_KEY", "")
          if not KEY:
              raise SystemExit("DATA_GO_KR_SERVICE_KEY is missing")

          # Historical span and all three racecourses; includes the known
          # 2017-06-11 Busan high-payout race and the official API sample.
          RACES = [
              ("20160701", 2, 8, "2016 Jeju"),
              ("20170611", 3, 5, "2017 Busan high payout"),
              ("20190504", 1, 1, "2019 Seoul"),
              ("20220806", 2, 2, "2022 Jeju official sample"),
              ("20250104", 1, 11, "2025 Seoul"),
              ("20250117", 2, 5, "2025 Jeju"),
              ("20250124", 3, 8, "2025 Busan"),
          ]

          def fetch_page(date, meet, rc_no, page, page_size=1000):
              params = {
                  "serviceKey": KEY,
                  "_type": "json",
                  "pool": "TRI",
                  "rc_date": date,
                  "meet": str(meet),
                  "rc_no": str(rc_no),
                  "pageNo": str(page),
                  "numOfRows": str(page_size),
              }
              url = API + "?" + urllib.parse.urlencode(params, safe="%")
              req = urllib.request.Request(url, headers={"User-Agent": "kra-v3-tri-grid-verifier/1.0"})
              last = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as response:
                          payload = json.load(response)
                      header = payload["response"]["header"]
                      if str(header.get("resultCode")) not in {"00", "0"}:
                          raise RuntimeError(f"API error: {header}")
                      body = payload["response"]["body"]
                      raw = body.get("items", {})
                      items = raw.get("item", []) if isinstance(raw, dict) else []
                      if isinstance(items, dict):
                          items = [items]
                      return int(body.get("totalCount", 0)), items
                  except Exception as exc:
                      last = exc
                      if attempt < 2:
                          time.sleep(2 * (attempt + 1))
              raise RuntimeError(f"request failed after retries: {last}")

          failures = []
          results = []
          for date, meet, rc_no, label in RACES:
              total, rows = fetch_page(date, meet, rc_no, 1)
              page = 2
              while len(rows) < total:
                  total_again, more = fetch_page(date, meet, rc_no, page)
                  if total_again != total:
                      raise RuntimeError(f"{date}_{meet}_{rc_no:02d}: totalCount changed")
                  if not more:
                      raise RuntimeError(f"{date}_{meet}_{rc_no:02d}: pagination stopped early")
                  rows.extend(more)
                  page += 1

              triples = [
                  (int(row["chulNo"]), int(row["chulNo2"]), int(row["chulNo3"]))
                  for row in rows
              ]
              unique = set(triples)
              runners = sorted({x for triple in triples for x in triple})
              expected = set(itertools.permutations(runners, 3))
              problems = []
              if len(rows) != total:
                  problems.append(f"downloaded={len(rows)} totalCount={total}")
              if len(unique) != len(rows):
                  problems.append(f"duplicate_rows={len(rows)-len(unique)}")
              if any(len(set(t)) != 3 for t in triples):
                  problems.append("repeated runner within a triple")
              missing = expected - unique
              extra = unique - expected
              if missing:
                  problems.append(f"missing_combinations={len(missing)}")
              if extra:
                  problems.append(f"extra_combinations={len(extra)}")

              race_id = f"{date[:4]}-{date[4:6]}-{date[6:]}_{meet}_{rc_no:02d}"
              status = "PASS" if not problems else "FAIL"
              print(
                  f"{status} race={race_id} label={label!r} runners={len(runners)} "
                  f"rows={len(rows)} unique={len(unique)} expected={len(expected)} "
                  f"totalCount={total} odds_field_all={all('odds' in row for row in rows)}"
              )
              if rows:
                  first = rows[0]
                  last = rows[-1]
                  print(
                      "  first="
                      f"({first['chulNo']},{first['chulNo2']},{first['chulNo3']}) odds={first.get('odds')} "
                      "last="
                      f"({last['chulNo']},{last['chulNo2']},{last['chulNo3']}) odds={last.get('odds')}"
                  )
              if problems:
                  print("  problems=" + "; ".join(problems))
                  failures.append((race_id, problems))
              results.append((race_id, len(runners), len(rows), len(unique), len(expected), total, status))

          print("\nSUMMARY")
          print("race_id,runners,rows,unique,expected,totalCount,status")
          for result in results:
              print(",".join(map(str, result)))
          if failures:
              raise SystemExit(f"TRI grid validation failed for {len(failures)} race(s)")
          print(f"ALL_PASS races={len(results)}")
          PY
