name: Virtual-cap FLB cluster calibration
on:
  pull_request:
    paths:
      - 'tests/test_virtual_cap_flb_cluster_calibration.py'
      - '.github/workflows/virtual-cap-flb-cluster-calibration.yml'
      - 'analyze_rank_profile_imputation.py'
      - 'kra/rank_profile.py'
      - '데이터/**'
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -r requirements-analysis.txt
      - run: python3 -m unittest tests.test_virtual_cap_flb_cluster_calibration -v
