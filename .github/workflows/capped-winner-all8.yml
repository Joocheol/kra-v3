name: Capped winner all-8 validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  all8:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install analysis dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-analysis.txt
      - name: Validate all 8 official 2025 capped winners
        run: python3 validate_capped_regime_winners_all8.py
