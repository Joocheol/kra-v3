name: Stabilize masked cross-entropy serialization

on:
  push:
    branches: [agent/outcome-evaluation]

permissions:
  contents: write

jobs:
  stabilize:
    if: github.event.head_commit.message != 'Stabilize masked cross-entropy serialization'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/outcome-evaluation
          fetch-depth: 1
          persist-credentials: true
      - name: Install analysis dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-analysis.txt
      - name: Apply common libm serialization policy
        run: |
          cp findings/masked_reconstruction.md /tmp/masked-report-before.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path('analyze_masked_reconstruction.py')
          text = p.read_text(encoding='utf-8')
          old = '''"cross_entropy_sum": format(float(\n                        -(truth * np.log(np.maximum(probabilities, 1e-300))).sum()\n                    ), ".12g"),'''
          new = '''"cross_entropy_sum": format(float(\n                        -(truth * np.log(np.maximum(probabilities, 1e-300))).sum()\n                    ), ".10g"),'''
          if text.count(old) != 1:
              raise SystemExit(f'cross-entropy serialization target count={text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 analyze_masked_reconstruction.py
          echo '--- REPORT DIFF ---'
          diff -u /tmp/masked-report-before.md findings/masked_reconstruction.md || true
          python3 -m unittest discover -s tests -v
      - name: Commit synchronized code and artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analyze_masked_reconstruction.py 데이터/masked_reconstruction_results.csv.gz findings/masked_reconstruction.md
          git commit -m 'Stabilize masked cross-entropy serialization'
          git push origin HEAD:agent/outcome-evaluation
