name: Liquidity-conditioned assignment

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  liquidity-assignment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install analysis dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-analysis.txt
      - name: Compare pooled and T/K-conditioned cross-pool assignment
        run: python3 analyze_liquidity_conditioned_assignment.py
