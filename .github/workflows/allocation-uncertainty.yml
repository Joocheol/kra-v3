name: Allocation uncertainty

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dm-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install analysis dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-analysis.txt
      - name: Calibrate Dirichlet-multinomial allocation intervals
        run: python3 analyze_allocation_uncertainty.py
