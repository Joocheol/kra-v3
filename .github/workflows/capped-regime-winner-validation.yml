name: Capped-regime winner validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  capped-regime-winner-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install analysis dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-analysis.txt
      - name: Revalidate official capped winners with capped-regime coefficients
        run: python3 validate_capped_regime_winners.py
