name: Repair masked reconstruction artifact

on:
  push:
    branches: [agent/outcome-evaluation]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Regenerate masked reconstruction artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/outcome-evaluation
          fetch-depth: 1
          persist-credentials: true
      - name: Install analysis dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-analysis.txt
      - name: Regenerate and diagnose
        run: |
          cp 데이터/masked_reconstruction_results.csv.gz /tmp/masked-before.csv.gz
          cp findings/masked_reconstruction.md /tmp/masked-report-before.md
          python3 analyze_masked_reconstruction.py
          python3 - <<'PY'
          import csv, gzip
          before='/tmp/masked-before.csv.gz'
          after='데이터/masked_reconstruction_results.csv.gz'
          changed = 0
          first = []
          with gzip.open(before,'rt',encoding='utf-8',newline='') as a, gzip.open(after,'rt',encoding='utf-8',newline='') as b:
              ra, rb = csv.DictReader(a), csv.DictReader(b)
              for lineno, (x, y) in enumerate(zip(ra, rb), 2):
                  if x != y:
                      changed += 1
                      if len(first) < 8:
                          first.append((lineno, x, y))
          print('MASKED_CHANGED_ROWS', changed)
          for lineno, x, y in first:
              print('MASKED_FIRST_DIFF_LINE', lineno)
              print('OLD', x)
              print('NEW', y)
          PY
          echo '--- REPORT DIFF ---'
          diff -u /tmp/masked-report-before.md findings/masked_reconstruction.md || true
          git diff --stat -- 데이터/masked_reconstruction_results.csv.gz findings/masked_reconstruction.md
      - name: Commit synchronized artifact
        run: |
          if git diff --quiet -- 데이터/masked_reconstruction_results.csv.gz findings/masked_reconstruction.md; then
            echo 'Already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 데이터/masked_reconstruction_results.csv.gz findings/masked_reconstruction.md
          git commit -m 'Regenerate masked reconstruction artifact'
          git push origin HEAD:agent/outcome-evaluation
