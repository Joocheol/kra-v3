name: Stabilize masked reconstruction serialization

on:
  push:
    branches: [agent/outcome-evaluation]

permissions:
  contents: write

jobs:
  stabilize:
    if: github.event.head_commit.message != 'Stabilize masked metric serialization'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/outcome-evaluation
          fetch-depth: 1
          persist-credentials: true
      - name: Install analysis dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-analysis.txt
      - name: Narrow unstable metric serialization and regenerate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('analyze_masked_reconstruction.py')
          text = p.read_text(encoding='utf-8')
          old = '''"squared_log1p_error_sum": format(float(\n                        np.square(np.log1p(predicted) - np.log1p(truth)).sum()\n                    ), ".12g"),'''
          new = '''"squared_log1p_error_sum": format(float(\n                        np.square(np.log1p(predicted) - np.log1p(truth)).sum()\n                    ), ".10g"),'''
          if old not in text:
              raise SystemExit('target serialization expression not found')
          if text.count(old) != 1:
              raise SystemExit('target serialization expression is not unique')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 analyze_masked_reconstruction.py
          git diff --check
          git diff -- analyze_masked_reconstruction.py findings/masked_reconstruction.md
          python3 -m unittest discover -s tests -v
      - name: Commit stabilized code and artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analyze_masked_reconstruction.py 데이터/masked_reconstruction_results.csv.gz findings/masked_reconstruction.md
          git commit -m 'Stabilize masked metric serialization'
          git push origin HEAD:agent/outcome-evaluation
