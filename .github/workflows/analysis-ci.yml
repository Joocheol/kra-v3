name: Analysis CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "no tests/ directory yet"
          fi

      - name: Process hygiene
        run: python scripts/check_process.py

      - name: Regenerate and verify frozen artifacts
        run: python scripts/check_freeze.py --regenerate

      - name: Upload regenerated artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: regenerated-artifacts
          path: .freeze-check/
          if-no-files-found: ignore
          retention-days: 7
