name: KRA OpenAPI smoke test

on:
  pull_request:
    paths:
      - '.github/workflows/kra-api-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kra-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
    steps:
      - name: Check KRA OpenAPI endpoints
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          key = os.environ.get("DATA_GO_KR_SERVICE_KEY", "")
          if not key:
              print("ERROR: DATA_GO_KR_SERVICE_KEY secret is missing or empty")
              sys.exit(1)

          tests = [
              {
                  "name": "race_overview_api3",
                  "url": "http://apis.data.go.kr/B551015/API3_1/raceInfo_1",
                  "params": {"pageNo": "1", "numOfRows": "1", "meet": "1", "rc_date": "20190504", "rc_no": "1", "_type": "json"},
                  "required_fields_any": ["rcDate", "rcNo", "meet", "totAmt"],
              },
              {
                  "name": "sales_and_dividend_rate",
                  "url": "http://apis.data.go.kr/B551015/API179_1/salesAndDividendRate_1",
                  "params": {"pageNo": "1", "numOfRows": "1", "meet": "1", "rc_date": "20190504", "rc_no": "1", "_type": "json"},
                  "required_fields_any": ["amt", "odds", "pool"],
              },
              {
                  "name": "integrated_dividend_rate",
                  "url": "http://apis.data.go.kr/B551015/API160_1/integratedInfo_1",
                  "params": {"pageNo": "1", "numOfRows": "1", "pool": "TRI", "meet": "2", "rc_date": "20220806", "rc_no": "2", "_type": "json"},
                  "required_fields_any": ["chulNo", "chulNo2", "chulNo3", "odds", "pool"],
              },
              {
                  "name": "race_detail_result_old_api214",
                  "url": "http://apis.data.go.kr/B551015/API214_1/RaceDetailResult_1",
                  "params": {"pageNo": "1", "numOfRows": "1", "meet": "2", "rc_date": "20220806", "rc_no": "2", "_type": "json"},
                  "required_fields_any": ["rank", "chulNo", "hrName", "ord"],
              },
              {
                  "name": "race_detail_result_new_racedetailresult",
                  "url": "http://apis.data.go.kr/B551015/racedetailresult/getracedetailresult",
                  "params": {"pageNo": "1", "numOfRows": "1", "meet": "2", "rc_date": "20220806", "rc_no": "2", "_type": "json"},
                  "required_fields_any": ["rank", "chulNo", "hrName", "ord"],
              },
          ]

          def get_nested(obj, *path):
              cur = obj
              for key in path:
                  if isinstance(cur, dict):
                      cur = cur.get(key)
                  else:
                      return None
              return cur

          def normalize_items(items):
              if items in (None, ""):
                  return []
              if isinstance(items, dict) and "item" in items:
                  items = items["item"]
              if isinstance(items, list):
                  return items
              return [items]

          def report_error_payload(text):
              try:
                  obj = json.loads(text)
                  header = obj.get("OpenAPI_ServiceResponse", {}).get("cmmMsgHeader", {})
                  if header:
                      print("error_payload=" + json.dumps(header, ensure_ascii=False, sort_keys=True))
              except Exception:
                  pass

          failures = []
          soft_failures = []
          for test in tests:
              params = dict(test["params"])
              params["serviceKey"] = key
              query = urllib.parse.urlencode(params, safe="%")
              url = test["url"] + "?" + query
              print(f"\n## {test['name']}")
              print(test["url"])
              public_params = {k: v for k, v in params.items() if k != "serviceKey"}
              print("params=" + json.dumps(public_params, ensure_ascii=False, sort_keys=True))
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "kra-v3-api-smoke/1.0"})
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      status = resp.status
                      content_type = resp.headers.get("content-type", "")
                      raw = resp.read(200000)
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  content_type = exc.headers.get("content-type", "") if exc.headers else ""
                  raw = exc.read(200000)
              except Exception as exc:
                  print(f"ERROR: request failed: {type(exc).__name__}: {exc}")
                  failures.append(test["name"])
                  continue

              text = raw.decode("utf-8", errors="replace")
              print(f"http_status={status}")
              print(f"content_type={content_type}")
              print(f"body_prefix={text[:240].replace(chr(10), ' ')}")
              if status != 200:
                  print("ERROR: non-200 response")
                  report_error_payload(text)
                  failures.append(test["name"])
                  continue

              handled = False
              try:
                  parsed = json.loads(text)
                  header = get_nested(parsed, "response", "header") or {}
                  body = get_nested(parsed, "response", "body") or {}
                  items = normalize_items(get_nested(body, "items"))
                  print("parse=json")
                  print(f"resultCode={header.get('resultCode')}")
                  print(f"resultMsg={header.get('resultMsg')}")
                  print(f"totalCount={body.get('totalCount')}")
                  print(f"item_count={len(items)}")
                  if items and isinstance(items[0], dict):
                      fields = sorted(items[0].keys())
                      print("first_item_fields=" + ",".join(fields[:80]))
                      missing = [f for f in test.get("required_fields_any", []) if f not in fields]
                      if len(missing) == len(test.get("required_fields_any", [])):
                          print("WARN: none of the expected representative fields were present")
                          soft_failures.append(test["name"])
                  if str(header.get("resultCode")) not in {"00", "0", "None"}:
                      print("ERROR: API resultCode is not success")
                      failures.append(test["name"])
                  elif len(items) == 0:
                      print("WARN: call succeeded but returned zero items")
                      soft_failures.append(test["name"])
                  handled = True
              except Exception:
                  pass

              if handled:
                  continue

              try:
                  root = ET.fromstring(text)
                  result_code = root.findtext(".//resultCode")
                  result_msg = root.findtext(".//resultMsg")
                  items = root.findall(".//item")
                  print("parse=xml")
                  print(f"resultCode={result_code}")
                  print(f"resultMsg={result_msg}")
                  print(f"item_count={len(items)}")
                  if items:
                      fields = sorted({child.tag for child in list(items[0])})
                      print("first_item_fields=" + ",".join(fields[:80]))
                  if result_code not in {"00", "0", None}:
                      print("ERROR: API resultCode is not success")
                      failures.append(test["name"])
                  elif len(items) == 0:
                      print("WARN: call succeeded but returned zero items")
                      soft_failures.append(test["name"])
              except Exception as exc:
                  print(f"ERROR: response is neither JSON nor XML: {exc}")
                  failures.append(test["name"])

          if failures:
              print("\nFAILED_ENDPOINTS=" + ",".join(failures))
              if soft_failures:
                  print("WARN_ENDPOINTS=" + ",".join(soft_failures))
              sys.exit(1)
          if soft_failures:
              print("\nWARN_ENDPOINTS=" + ",".join(soft_failures))
          print("\nKRA OpenAPI smoke tests completed.")
          PY
