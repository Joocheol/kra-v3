name: KRA OpenAPI smoke test

on:
  pull_request:
    paths:
      - '.github/workflows/kra-api-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kra-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
    steps:
      - name: Check Dropbox race-id sample against KRA APIs
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          key = os.environ.get("DATA_GO_KR_SERVICE_KEY", "")
          if not key:
              print("ERROR: DATA_GO_KR_SERVICE_KEY secret is missing or empty")
              sys.exit(1)

          # These race_ids were taken from Dropbox:
          # /kra-analysis/data/raw_collected_v3_15w/kra_2025/raw_archive/2025/2025-01/*.json.gz
          samples = [
              "2025-01-24_3_08",
              "2025-01-26_3_04",
              "2025-01-04_1_11",
              "2025-01-17_2_05",
              "2025-01-10_2_02",
          ]

          ENDPOINTS = {
              "overview": "http://apis.data.go.kr/B551015/API3_1/raceInfo_1",
              "sales": "http://apis.data.go.kr/B551015/API179_1/salesAndDividendRate_1",
              "tri": "http://apis.data.go.kr/B551015/API160_1/integratedInfo_1",
              "detail": "http://apis.data.go.kr/B551015/racedetailresult/getracedetailresult",
          }

          def get_nested(obj, *path):
              cur = obj
              for key in path:
                  if isinstance(cur, dict):
                      cur = cur.get(key)
                  else:
                      return None
              return cur

          def normalize_items(items):
              if items in (None, ""):
                  return []
              if isinstance(items, dict) and "item" in items:
                  items = items["item"]
              if isinstance(items, list):
                  return items
              return [items]

          def call_json(name, params):
              params = dict(params)
              params["serviceKey"] = key
              params["_type"] = "json"
              url = ENDPOINTS[name] + "?" + urllib.parse.urlencode(params, safe="%")
              req = urllib.request.Request(url, headers={"User-Agent": "kra-v3-api-smoke/1.0"})
              with urllib.request.urlopen(req, timeout=45) as resp:
                  text = resp.read(400000).decode("utf-8", errors="replace")
              data = json.loads(text)
              header = get_nested(data, "response", "header") or {}
              body = get_nested(data, "response", "body") or {}
              result_code = str(header.get("resultCode"))
              result_msg = header.get("resultMsg")
              if result_code not in {"00", "0", "None"}:
                  raise RuntimeError(f"{name} resultCode={result_code} resultMsg={result_msg}")
              return body, normalize_items(get_nested(body, "items"))

          def active_count_from_detail(items):
              # The new racedetailresult API can include scratched/excluded horses.
              # chulYn=0 appears for actual starters in sampled successful records.
              # If chulYn is unavailable, fall back to rows with a positive finish/start order.
              with_chulyn = [x for x in items if isinstance(x, dict) and "chulYn" in x]
              if with_chulyn:
                  return sum(str(x.get("chulYn")) == "0" for x in with_chulyn)
              with_stord = [x for x in items if isinstance(x, dict) and "stOrd" in x]
              if with_stord:
                  return sum(str(x.get("stOrd")) not in {"", "0", "None", "null"} for x in with_stord)
              return len(items)

          failures = []
          print("race_id,overview_count,sales_pools,detail_rows,active_horses,tri_rows,expected_tri_rows,checks")
          for race_id in samples:
              date, meet, rc_no = race_id.split("_")
              rc_date = date.replace("-", "")
              base = {"pageNo": "1", "numOfRows": "200", "meet": meet, "rc_date": rc_date, "rc_no": str(int(rc_no))}
              checks = []
              try:
                  overview_body, overview_items = call_json("overview", {**base, "numOfRows": "10"})
                  if int(overview_body.get("totalCount", 0) or 0) != 1:
                      raise AssertionError(f"overview totalCount={overview_body.get('totalCount')}")
                  ov = overview_items[0]
                  for field in ("rcDate", "rcNo", "meet"):
                      if field not in ov:
                          raise AssertionError(f"overview missing {field}")
                  checks.append("overview")

                  sales_body, sales_items = call_json("sales", base)
                  pools = {str(x.get("pool")) for x in sales_items if isinstance(x, dict)}
                  if int(sales_body.get("totalCount", 0) or 0) < 1 or not pools:
                      raise AssertionError("sales returned no pools")
                  if not all({"amt", "odds", "pool"}.issubset(x.keys()) for x in sales_items if isinstance(x, dict)):
                      raise AssertionError("sales missing amt/odds/pool in at least one item")
                  checks.append("sales")

                  detail_body, detail_items = call_json("detail", base)
                  detail_rows = int(detail_body.get("totalCount", 0) or 0)
                  if detail_rows < 3:
                      raise AssertionError(f"detail totalCount={detail_rows}")
                  detail_fields = set(detail_items[0].keys()) if detail_items and isinstance(detail_items[0], dict) else set()
                  if not {"chulNo", "hrName", "rcDate", "rcNo"}.issubset(detail_fields):
                      raise AssertionError(f"detail missing representative fields: {detail_fields}")
                  active_horses = active_count_from_detail(detail_items)
                  if active_horses < 3:
                      raise AssertionError(f"active_horses={active_horses}")
                  checks.append("detail")

                  expected_tri = active_horses * (active_horses - 1) * (active_horses - 2)
                  tri_body, tri_items = call_json("tri", {**base, "pool": "TRI", "numOfRows": "1"})
                  tri_rows = int(tri_body.get("totalCount", 0) or 0)
                  if tri_rows != expected_tri:
                      raise AssertionError(f"tri totalCount={tri_rows}, expected={expected_tri}")
                  if tri_items and not {"chulNo", "chulNo2", "chulNo3", "odds"}.issubset(tri_items[0].keys()):
                      raise AssertionError("tri missing combination fields")
                  checks.append("tri_count")

                  print(f"{race_id},{overview_body.get('totalCount')},{len(pools)},{detail_rows},{active_horses},{tri_rows},{expected_tri},{'|'.join(checks)}")
              except Exception as exc:
                  print(f"{race_id},ERROR,,,,,,{type(exc).__name__}: {exc}")
                  failures.append(race_id)

          if failures:
              print("FAILED_RACES=" + ",".join(failures))
              sys.exit(1)
          print("Sample Dropbox race-id consistency check completed.")
          PY
